[package]
name = "tok-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tok-sim"
readme = "README.md"
# the tests and examples read the conformance corpus and the fixtures of the repository
exclude = ["tests/", "examples/"]
keywords = ["bpmn", "simulation", "discrete-event", "process-mining", "tok"]
categories = ["simulation", "science"]
description = "Discrete-event simulator of the tok process language"

[dependencies]
tok-core = { path = "../tok-core", version = "1.0.2" }
thiserror = "2.0.21"
indexmap = "2"

[dev-dependencies]
serde_json = "1.0.154"
roxmltree = "0.21.2"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["tok-core", "tok-bpmn", "tok-cli", "tok-py"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Marek Deja"]
repository = "https://codeberg.org/MarekDeja/tok"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

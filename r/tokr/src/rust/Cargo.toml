[package]
name = "tok-r"
version = "0.8.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Marek Deja"]
description = "R bindings of the tok engine (package tokr)"
publish = false

[lib]
name = "tokr"
crate-type = ["staticlib"]

[dependencies]
tok-core = { path = "../../../../rust/tok-core" }
tok-bpmn = { path = "../../../../rust/tok-bpmn" }
tok-sim = { path = "../../../../rust/tok-sim" }
extendr-api = "0.9"

[profile.release]
lto = true
codegen-units = 1

[package]
name = "tok-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tok-mcp"
readme = "README.md"
# the tests and examples read the conformance corpus and the fixtures of the repository
exclude = ["tests/", "examples/"]
keywords = ["mcp", "bpmn", "dmn", "agents", "tok"]
categories = ["development-tools", "command-line-utilities"]
description = "MCP server of the tok process language: check, format, export, import, simulate and evaluate models from AI agents"

[[bin]]
name = "tok-mcp"
path = "src/main.rs"

[dependencies]
tok-cli = { path = "../tok-cli", version = "1.0.2" }
serde_json = "1.0.154"

[lints]
workspace = true

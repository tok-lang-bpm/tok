[package]
name = "tok-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tok-core"
readme = "README.md"
# the tests and examples read the conformance corpus and the fixtures of the repository
exclude = ["tests/", "examples/"]
keywords = ["bpmn", "dmn", "feel", "process-modelling", "tok"]
categories = ["parser-implementations", "science"]
description = "Parser, checker, canonical printer, BPMN 2.0 and DMN 1.5 export and import, and FEEL of the tok process language"

[dependencies]
indexmap = "2"
roxmltree = "0.21.2"

[dev-dependencies]
tok-bpmn = { path = "../tok-bpmn" }
serde_json = "1.0.154"

[lints]
workspace = true

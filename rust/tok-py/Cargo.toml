[package]
name = "tok-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings of the tok engine (module tok._engine of the package tok-lang)"
publish = false

[lib]
name = "tok_engine"
crate-type = ["cdylib"]
# The extension module links against the Python runtime only when loaded by Python,
# so it has no Rust test harness; parity is tested from Python (python/tests/test_engine_parity.py).
test = false
doctest = false

[dependencies]
tok-core = { path = "../tok-core" }
tok-bpmn = { path = "../tok-bpmn" }
tok-sim = { path = "../tok-sim" }
tok-cli = { path = "../tok-cli" }
pyo3 = { version = "0.29", features = ["abi3-py38", "extension-module"] }

# Not `workspace = true`: the workspace forbids unsafe code, but the code generated by
# PyO3's #[pymodule]/#[pyfunction] macros contains unsafe blocks. This crate itself
# writes no unsafe code.
[lints.clippy]
unwrap_used = "warn"

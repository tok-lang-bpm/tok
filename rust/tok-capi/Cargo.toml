[package]
name = "tok-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "C interface of the tok engine: shared and static library tokengine with a JSON-based API"
publish = false

[lib]
name = "tokengine"
# cdylib: libtokengine.so, tokengine.dll, libtokengine.dylib for ccall and dlopen;
# staticlib: libtokengine.a (tokengine.lib with MSVC) for
# static linking; rlib: the integration tests call the exported functions directly
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tok-core = { path = "../tok-core" }
tok-bpmn = { path = "../tok-bpmn" }
tok-sim = { path = "../tok-sim" }
tok-cli = { path = "../tok-cli" }

[dev-dependencies]
serde_json = "1.0.154"

# Not `workspace = true`: the workspace forbids unsafe code, and this crate needs it at
# the C boundary. Unsafe code is denied in the crate and allowed only in the module
# `ffi`, which holds the exported functions; every block there has a SAFETY comment.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"

[workspace]
resolver = "3"
members = ["tok-core", "tok-bpmn", "tok-cli", "tok-py", "tok-sim", "tok-capi", "tok-lsp", "tok-mcp", "tok-wasm", "tok-bench"]
exclude = ["fuzz"]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Marek Deja"]
repository = "https://github.com/tok-lang-bpm/tok"
homepage = "https://tok-lang-bpm.github.io/"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
